services:
  # Single Unified Full-Stack Web Service (Serves both React Frontend and FastAPI Backend)
  - type: web
    name: campus-network-simulator
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 10000
